[package]
name = "libmitos-audio"
version = "0.1.0"
edition = "2021"
description = "Typed async client for the mitos-audio daemon (for mitos-gui, mitos-settings, apps)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"