[workspace]
members = ["client"]

[package]
name = "mitos-audio"
version = "0.2.0"
edition = "2021"
description = "MITOS system audio management service (user-facing layer above ALSA)"
license = "MIT"

[features]
default = ["alsa-backend", "udev-hotplug"]
alsa-backend = ["alsa"]
udev-hotplug = ["udev"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
alsa = { version = "0.9", optional = true }
udev = { version = "0.9", optional = true }